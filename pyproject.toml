[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "Shadrach Oloyede", email = "shadrach@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "braintrust>=0.35.0",
    "cohere>=7.0.8",
    "deepeval>=4.2.0",
    "docling>=2.117.0",
    "elasticsearch>=8.15.0,<9",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "kagglehub>=1.0.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-docling>=2.0.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.4.1",
    "langchain-pinecone>=0.2.13",
    "langchain-postgres>=0.0.17",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchain-voyageai>=0.4.0",
    "langgraph>=1.0.0",
    "markdown-it-py>=3.0.0",
    "maturin>=1.14.1",
    "mcp>=1.24.0,<2",
    "pdf-inspector>=0.2.6",
    "pinecone[asyncio]>=7.3.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
rag = "rag.main:main"
rag-agent = "rag.main:agent_rag"
rag-eval-dataset = "rag.eval.dataset:main"
rag-eval = "rag.eval.run:main"
rag-eval-generator = "rag.eval.deepeval_run:main"
rag-eval-braintrust = "rag.eval.braintrust_eval:main"
rag-eval-braintrust-generator = "rag.eval.braintrust_generator:main"
rag-eval-grid = "rag.eval.grid:main"
rag-ingest = "rag.ingest:main"
search-api = "api.app:run"

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent", "rag", "api"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"rag" = "src/rag"
"api" = "src/api"


[tool.setuptools.package-data]
"*" = ["py.typed"]
"api" = ["templates/*.html"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"scripts/*" = ["D", "T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "deepeval: incurs LLM-as-a-judge evaluation calls",
    "integration: needs running Postgres/Elasticsearch indexes",
]

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
