<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .markdown-body { line-height: 1.6; }
      .markdown-body h1, .markdown-body h2, .markdown-body h3,
      .markdown-body h4, .markdown-body h5, .markdown-body h6 {
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }
      .markdown-body h1 { font-size: 1.6rem; }
      .markdown-body h2 { font-size: 1.35rem; }
      .markdown-body h3 { font-size: 1.15rem; }
      .markdown-body p { margin-bottom: 0.85rem; }
      .markdown-body ul, .markdown-body ol { padding-left: 1.5rem; margin-bottom: 0.85rem; }
      .markdown-body pre {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 0.375rem;
        padding: 0.75rem 1rem;
        overflow-x: auto;
      }
      .markdown-body code {
        background: #f8f9fa;
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
        font-size: 0.9em;
      }
      .markdown-body pre code { background: none; padding: 0; }
      .markdown-body table { width: 100%; margin-bottom: 1rem; border-collapse: collapse; }
      .markdown-body th, .markdown-body td {
        border: 1px solid #dee2e6;
        padding: 0.4rem 0.6rem;
        vertical-align: top;
      }
      .markdown-body th { background: #f8f9fa; }
      .markdown-body blockquote {
        border-left: 4px solid #dee2e6;
        padding-left: 1rem;
        color: #6c757d;
      }
      .markdown-body img { max-width: 100%; height: auto; }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">Retriever Playground</a>
      </div>
    </nav>
    <main class="container pb-5">
      <p><a href="/">&larr; Back to search</a></p>
      <h1 class="h3 mb-3">{{ title }}</h1>
      {% if meta %}
      <p class="text-muted">
        {% if meta.page is not none %}Page {{ meta.page }}{% endif %}
        {% if meta.score %} &middot; Score {{ "%.4f"|format(meta.score) }}{% endif %}
      </p>
      {% endif %}
      <article class="markdown-body bg-white border rounded p-4">
        {{ content | markdown }}
      </article>
    </main>
  </body>
</html>
